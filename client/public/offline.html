<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <title>Offline - StudyPartner</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background-color: #f5f5f5;
        color: #111111;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        background: #ffffff;
        border: 1px solid #dddddd;
        border-radius: 8px;
        padding: 48px 40px;
        max-width: 440px;
        width: 100%;
        text-align: center;
      }
      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        background: #111111;
        color: #ffffff;
        font-size: 1.25rem;
        font-weight: 700;
        border-radius: 8px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 8px;
        color: #111111;
      }
      p {
        font-size: 0.875rem;
        color: #666666;
        margin: 0 0 24px;
        line-height: 1.6;
      }
      button {
        background: #111111;
        color: #ffffff;
        border: none;
        border-radius: 5px;
        padding: 12px 24px;
        font-size: 0.875rem;
        font-weight: 500;
        cursor: pointer;
        min-height: 44px;
      }
      button:hover {
        background: #333333;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">SP</div>
      <h1>You are offline</h1>
      <p>
        StudyPartner cannot reach the server right now.
        Check your internet connection and try again.
      </p>
      <button onclick="window.location.reload()">Retry</button>
    </div>
  </body>
</html>
